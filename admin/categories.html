<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Категории — LOOKSÒR</title>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script>window.LOOKSOR_BASE = '../';</script>
</head>
<body class="admin" data-admin="categories">
  <div class="admin-top">
    <a class="brand" href="index.html">LOOKSÒR</a>
    <button class="menu-toggle" type="button" data-admin-menu>Меню</button>
  </div>
  <aside id="admin-aside">
    <a class="brand desktop-brand" href="index.html">LOOKSÒR</a>
    <div class="nav-label">Магазин</div>
    <a href="index.html">Товары</a>
    <a href="product.html">Новый товар</a>
    <a class="is-on" href="categories.html">Категории</a>
    <a href="media.html">Фото сайта</a>
    <a href="settings.html">Контакты</a>
    <a href="orders.html">Заказы</a>
    <div class="nav-label">Прочее</div>
    <a href="../index.html" target="_blank">Открыть сайт</a>
    <a href="#" id="logout-link">Выйти</a>
  </aside>
  <main class="admin-main">
    <div class="page-head">
      <div>
        <h1>Категории</h1>
        <p>Можно создать, переименовать, скрыть или удалить (если в категории нет товаров).</p>
      </div>
    </div>
    <div class="cat-card">
      <h2>Новая категория</h2>
      <form id="cat-new" class="inline">
        <label class="field">Slug <input name="slug" placeholder="platya" required></label>
        <label class="field">Название RU <input name="name_ru" required></label>
        <label class="field">UZ <input name="name_uz" required></label>
        <label class="field">EN <input name="name_en" required></label>
        <label class="field">Сортировка <input name="sort_order" type="number" value="0"></label>
        <label class="check"><input type="checkbox" name="is_active" checked> Показывать</label>
        <button class="btn" type="submit">Добавить</button>
      </form>
    </div>
    <div id="cat-list"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
